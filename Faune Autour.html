<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Faune Autour">
<title>Faune Autour</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f0;color:#1a1a1a;min-height:100vh;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;padding:0 0 80px}
.header{background:#fff;border-bottom:0.5px solid rgba(0,0,0,0.12);padding:16px 16px 12px;position:sticky;top:0;z-index:10}
.header h1{font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px}
.gps-dot{width:8px;height:8px;border-radius:50%;background:#1D9E75;display:inline-block;flex-shrink:0}
.gps-dot.pulsing{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.gps-info{font-size:12px;color:#888;margin-top:4px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#fff;border-bottom:0.5px solid rgba(0,0,0,0.12)}
.tab{padding:12px;text-align:center;font-size:14px;cursor:pointer;border-bottom:2px solid transparent;color:#888;transition:all .2s;-webkit-tap-highlight-color:transparent}
.tab.active{color:#1a1a1a;border-bottom-color:#1a1a1a;font-weight:500}
.panel{display:none;padding:16px;gap:14px;flex-direction:column}
.panel.active{display:flex}
label{font-size:13px;color:#666;display:block;margin-bottom:5px}
input[type=text],select{width:100%;padding:10px 12px;border:0.5px solid rgba(0,0,0,0.18);border-radius:10px;font-size:15px;background:#fff;color:#1a1a1a;outline:none;-webkit-appearance:none}
input[type=text]:focus{border-color:#1a1a1a}
.slider-row{display:flex;align-items:center;gap:10px}
.slider-row input[type=range]{flex:1;-webkit-appearance:none;height:4px;background:#ddd;border-radius:2px;outline:none}
.slider-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#1a1a1a;cursor:pointer}
.slider-val{font-size:14px;font-weight:500;min-width:38px;text-align:right;color:#1a1a1a}
.btn{width:100%;padding:13px;background:#1a1a1a;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer;margin-top:2px;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.98);opacity:.9}
.btn:disabled{opacity:.35;cursor:default}
.results{padding:0 16px}
.section-title{font-size:13px;color:#888;padding:16px 0 8px;font-weight:500}
.card{background:#fff;border:0.5px solid rgba(0,0,0,0.1);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.species-name{font-size:15px;font-weight:500;line-height:1.3}
.species-latin{font-size:12px;color:#888;font-style:italic;margin-top:2px}
.badge{font-size:11px;padding:3px 8px;border-radius:20px;background:#f0f0ec;color:#666;white-space:nowrap;flex-shrink:0}
.card-meta{display:flex;gap:12px;margin-top:8px;font-size:12px;color:#999;flex-wrap:wrap}
.group-header{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:#aaa;padding:14px 0 5px;border-top:0.5px solid rgba(0,0,0,0.08);margin-top:4px}
.group-header:first-of-type{border-top:none;margin-top:0}
.empty{text-align:center;padding:48px 20px;color:#aaa;font-size:14px;line-height:1.6}
.loading{text-align:center;padding:40px;color:#aaa;font-size:14px}
.error-box{background:#fff0f0;color:#c0392b;border-radius:10px;padding:12px 14px;font-size:14px;margin-top:8px;border:0.5px solid rgba(192,57,43,0.2)}
.chips{display:flex;gap:7px}
.chip{padding:7px 14px;border-radius:20px;border:0.5px solid rgba(0,0,0,0.18);font-size:13px;cursor:pointer;background:#fff;color:#666;transition:all .15s;-webkit-tap-highlight-color:transparent}
.chip.active{background:#1a1a1a;color:#fff;border-color:transparent}
.attr{font-size:11px;color:#bbb;text-align:center;padding:24px 0 8px}
.attr a{color:#bbb}
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <h1><span class="gps-dot pulsing" id="gps-dot"></span> Faune Autour</h1>
    <div class="gps-info" id="gps-info">Localisation en cours...</div>
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-search" onclick="switchTab('search')">Par espèce</div>
    <div class="tab" id="tab-explore" onclick="switchTab('explore')">Explorer autour</div>
  </div>

  <!-- MODE 1 : PAR ESPECE -->
  <div class="panel active" id="panel-search">
    <div>
      <label>Nom de l'animal (français ou latin)</label>
      <input type="text" id="search-input" placeholder="ex: renard, Vulpes vulpes, chevreuil…"
        onkeydown="if(event.key==='Enter')doSearch()">
    </div>
    <div>
      <label>Rayon de recherche</label>
      <div class="slider-row">
        <input type="range" min="1" max="10" step="1" value="5" id="search-radius"
          oninput="document.getElementById('search-radius-val').textContent=this.value+' km'">
        <span class="slider-val" id="search-radius-val">5 km</span>
      </div>
    </div>
    <button class="btn" id="btn-search" onclick="doSearch()">Chercher les observations</button>
  </div>

  <!-- MODE 2 : EXPLORER -->
  <div class="panel" id="panel-explore">
    <div>
      <label>Rayon</label>
      <div class="slider-row">
        <input type="range" min="1" max="10" step="1" value="5" id="explore-radius"
          oninput="document.getElementById('explore-radius-val').textContent=this.value+' km'">
        <span class="slider-val" id="explore-radius-val">5 km</span>
      </div>
    </div>
    <div>
      <label>Période</label>
      <div class="chips">
        <div class="chip active" onclick="setPeriod(this,'week')">Semaine</div>
        <div class="chip" onclick="setPeriod(this,'month')">Mois</div>
        <div class="chip" onclick="setPeriod(this,'year')">Année</div>
      </div>
    </div>
    <button class="btn" id="btn-explore" onclick="doExplore()">Lister les animaux</button>
  </div>

  <div class="results" id="results"></div>

  <div class="attr">Données : <a href="https://www.gbif.org" target="_blank">GBIF</a> · incluant observations.be</div>

</div>
<script>
var gpsLat=null,gpsLon=null,gpsReady=false,selectedPeriod='week';

function setPeriod(el,p){
  selectedPeriod=p;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
}

function switchTab(t){
  ['search','explore'].forEach(function(id){
    document.getElementById('tab-'+id).classList.toggle('active',t===id);
    document.getElementById('panel-'+id).classList.toggle('active',t===id);
  });
  document.getElementById('results').innerHTML='';
}

function gpsInit(){
  if(!navigator.geolocation){
    setGpsStatus('GPS non disponible sur cet appareil','#e74c3c',false);
    gpsLat=50.8503;gpsLon=4.3517;gpsReady=true;
    return;
  }
  navigator.geolocation.getCurrentPosition(
    function(pos){
      gpsLat=pos.coords.latitude;
      gpsLon=pos.coords.longitude;
      gpsReady=true;
      document.getElementById('gps-dot').style.background='#1D9E75';
      document.getElementById('gps-dot').classList.remove('pulsing');
      setGpsStatus('Position: '+gpsLat.toFixed(5)+', '+gpsLon.toFixed(5),'#888',false);
    },
    function(err){
      setGpsStatus('GPS refusé — simulation sur Bruxelles','#e67e22',false);
      gpsLat=50.8503;gpsLon=4.3517;gpsReady=true;
      document.getElementById('gps-dot').style.background='#e67e22';
      document.getElementById('gps-dot').classList.remove('pulsing');
    },
    {enableHighAccuracy:true,timeout:10000,maximumAge:60000}
  );
}

function setGpsStatus(msg,color,pulsing){
  var el=document.getElementById('gps-info');
  el.textContent=msg;
  el.style.color=color||'#888';
}

function bboxWkt(lat,lon,km){
  var d=km/111.0;
  var dlon=km/(111.0*Math.cos(lat*Math.PI/180));
  var minLat=lat-d,maxLat=lat+d,minLon=lon-dlon,maxLon=lon+dlon;
  return 'POLYGON(('+minLon+' '+minLat+','+maxLon+' '+minLat+','+maxLon+' '+maxLat+','+minLon+' '+maxLat+','+minLon+' '+minLat+'))';
}

function dateFrom(period){
  var now=new Date();
  if(period==='week') return new Date(now-7*86400000).toISOString().split('T')[0];
  if(period==='month'){var d=new Date(now);d.setMonth(d.getMonth()-1);return d.toISOString().split('T')[0];}
  if(period==='year'){var d=new Date(now);d.setFullYear(d.getFullYear()-1);return d.toISOString().split('T')[0];}
}

function today(){return new Date().toISOString().split('T')[0];}

async function doSearch(){
  if(!gpsReady){showError('Position GPS non encore disponible, patientez.');return;}
  var q=document.getElementById('search-input').value.trim();
  if(!q){showError('Entrez un nom d\'animal.');return;}
  var radius=parseInt(document.getElementById('search-radius').value);
  setLoading('btn-search','Recherche en cours…');
  try{
    var matchRes=await fetch('https://api.gbif.org/v1/species/match?name='+encodeURIComponent(q)+'&kingdom=Animalia');
    var match=await matchRes.json();
    if(!match.usageKey){
      showError('Espèce non trouvée dans GBIF.<br>Essayez le nom latin (ex: <em>Vulpes vulpes</em>).');
      resetBtn('btn-search','Chercher les observations');return;
    }
    var wkt=bboxWkt(gpsLat,gpsLon,radius);
    var url='https://api.gbif.org/v1/occurrence/search'
      +'?taxonKey='+match.usageKey
      +'&geometry='+encodeURIComponent(wkt)
      +'&hasCoordinate=true'
      +'&occurrenceStatus=PRESENT'
      +'&limit=100';
    var res=await fetch(url);
    var data=await res.json();
    renderSearch(data.results||[],match,radius,data.count||0);
  }catch(e){showError('Erreur réseau. Vérifiez votre connexion.');}
  resetBtn('btn-search','Chercher les observations');
}

async function doExplore(){
  if(!gpsReady){showError('Position GPS non encore disponible, patientez.');return;}
  var radius=parseInt(document.getElementById('explore-radius').value);
  var after=dateFrom(selectedPeriod);
  var wkt=bboxWkt(gpsLat,gpsLon,radius);
  setLoading('btn-explore','Chargement…');
  try{
    var url='https://api.gbif.org/v1/occurrence/search'
      +'?geometry='+encodeURIComponent(wkt)
      +'&kingdomKey=1'
      +'&hasCoordinate=true'
      +'&occurrenceStatus=PRESENT'
      +'&eventDate='+after+','+today()
      +'&limit=300';
    var res=await fetch(url);
    var data=await res.json();
    renderExplore(data.results||[],radius,selectedPeriod,data.count||0);
  }catch(e){showError('Erreur réseau. Vérifiez votre connexion.');}
  resetBtn('btn-explore','Lister les animaux');
}

function renderSearch(results,match,radius,total){
  var el=document.getElementById('results');
  var speciesLabel=match.vernacularName||match.canonicalName||match.scientificName||'?';
  var latinLabel=match.scientificName||'';
  if(!results.length){
    el.innerHTML='<div class="section-title">'+speciesLabel+'</div>'
      +'<div class="empty">Aucune observation trouvée<br>dans un rayon de '+radius+' km.</div>';
    return;
  }
  var html='<div class="section-title">'+results.length+' observation(s) · '+speciesLabel+' · '+radius+' km</div>';
  results.forEach(function(r){
    var date=r.eventDate?r.eventDate.split('T')[0]:(r.year?String(r.year):'—');
    var loc=r.locality||r.municipality||r.stateProvince||r.country||'';
    var coords=r.decimalLatitude?r.decimalLatitude.toFixed(4)+', '+r.decimalLongitude.toFixed(4):'';
    html+='<div class="card">'
      +'<div class="card-top">'
      +'<div><div class="species-name">'+(r.vernacularName||r.species||r.scientificName||'Inconnu')+'</div>'
      +'<div class="species-latin">'+(r.scientificName||'')+'</div></div>'
      +'<span class="badge">'+date+'</span>'
      +'</div>'
      +'<div class="card-meta">'+(loc?'<span>'+loc+'</span>':'')+(coords?'<span>'+coords+'</span>':'')+'</div>'
      +'</div>';
  });
  if(total>results.length) html+='<div class="section-title">'+total+' observations au total · affichage limité à '+results.length+'</div>';
  el.innerHTML=html;
}

function renderExplore(results,radius,period,total){
  var el=document.getElementById('results');
  var pLabel={week:'cette semaine',month:'ce mois-ci',year:'cette année'}[period];
  if(!results.length){
    el.innerHTML='<div class="empty">Aucune observation trouvée<br>dans un rayon de '+radius+' km '+pLabel+'.</div>';
    return;
  }
  var classLabels={Aves:'Oiseaux',Mammalia:'Mammifères',Reptilia:'Reptiles',
    Amphibia:'Amphibiens',Actinopterygii:'Poissons',Insecta:'Insectes',
    Arachnida:'Arachnides',Lepidoptera:'Lépidoptères'};
  var speciesMap={};
  results.forEach(function(r){
    var key=r.speciesKey||r.taxonKey;
    if(!key)return;
    if(!speciesMap[key]){
      speciesMap[key]={
        name:r.vernacularName||r.species||r.scientificName||'Inconnu',
        latin:r.scientificName||'',
        cls:r.class||'',
        count:0,
        lastDate:''
      };
    }
    speciesMap[key].count++;
    var d=r.eventDate||'';
    if(d>speciesMap[key].lastDate) speciesMap[key].lastDate=d;
  });
  var species=Object.values(speciesMap).sort(function(a,b){return b.count-a.count;});
  var groups={};
  species.forEach(function(s){
    var g=classLabels[s.cls]||s.cls||'Autres';
    if(!groups[g])groups[g]=[];
    groups[g].push(s);
  });
  var totalSpecies=species.length;
  var html='<div class="section-title">'+totalSpecies+' espèce(s) · rayon '+radius+' km · '+pLabel+'</div>';
  Object.keys(groups).sort().forEach(function(group){
    html+='<div class="group-header">'+group+'</div>';
    groups[group].forEach(function(s){
      var date=s.lastDate?s.lastDate.split('T')[0]:'—';
      html+='<div class="card">'
        +'<div class="card-top">'
        +'<div><div class="species-name">'+s.name+'</div>'
        +'<div class="species-latin">'+s.latin+'</div></div>'
        +'<span class="badge">'+s.count+' obs.</span>'
        +'</div>'
        +'<div class="card-meta"><span>Dernière obs. '+date+'</span></div>'
        +'</div>';
    });
  });
  if(total>results.length) html+='<div class="section-title" style="color:#e67e22">'+total+' observations au total — affichage des 300 premières</div>';
  el.innerHTML=html;
}

function showError(msg){
  document.getElementById('results').innerHTML='<div class="error-box">'+msg+'</div>';
}
function setLoading(btnId,msg){
  var b=document.getElementById(btnId);
  b.disabled=true;b.textContent=msg;
  document.getElementById('results').innerHTML='<div class="loading">Consultation de GBIF...</div>';
}
function resetBtn(btnId,label){
  var b=document.getElementById(btnId);
  b.disabled=false;b.textContent=label;
}

gpsInit();
</script>
</body>
</html>
