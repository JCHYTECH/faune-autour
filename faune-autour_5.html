<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Faune Autour">
<title>Faune Autour</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f0;color:#1a1a1a;min-height:100vh;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;padding:0 0 80px}
.header{background:#fff;border-bottom:0.5px solid rgba(0,0,0,0.12);padding:16px 16px 12px;position:sticky;top:0;z-index:10}
.header h1{font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px}
.gps-dot{width:8px;height:8px;border-radius:50%;background:#1D9E75;display:inline-block;flex-shrink:0}
.gps-dot.pulsing{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.gps-info{font-size:12px;color:#888;margin-top:4px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#fff;border-bottom:0.5px solid rgba(0,0,0,0.12)}
.tab{padding:12px;text-align:center;font-size:14px;cursor:pointer;border-bottom:2px solid transparent;color:#888;transition:all .2s}
.tab.active{color:#1a1a1a;border-bottom-color:#1a1a1a;font-weight:500}
.panel{display:none;padding:16px;gap:14px;flex-direction:column}
.panel.active{display:flex}
label{font-size:13px;color:#666;display:block;margin-bottom:5px}
input[type=text]{width:100%;padding:10px 12px;border:0.5px solid rgba(0,0,0,0.18);border-radius:10px;font-size:15px;background:#fff;color:#1a1a1a;outline:none;-webkit-appearance:none}
input[type=text]:focus{border-color:#1a1a1a}
.slider-row{display:flex;align-items:center;gap:10px}
.slider-row input[type=range]{flex:1;-webkit-appearance:none;height:4px;background:#ddd;border-radius:2px;outline:none}
.slider-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#1a1a1a;cursor:pointer}
.slider-val{font-size:14px;font-weight:500;min-width:38px;text-align:right;color:#1a1a1a}
.btn{width:100%;padding:13px;background:#1a1a1a;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer;margin-top:2px}
.btn:active{transform:scale(.98);opacity:.9}
.btn:disabled{opacity:.35;cursor:default}
.btn-map{width:100%;padding:10px;background:#fff;color:#1a1a1a;border:0.5px solid rgba(0,0,0,0.18);border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;margin-top:4px}
.btn-map:active{background:#f5f5f0}
.results{padding:0 16px}
.summary-box{background:#fff;border:0.5px solid rgba(0,0,0,0.1);border-radius:12px;padding:12px 14px;margin:12px 0 4px;display:flex;justify-content:space-between;align-items:center}
.summary-label{font-size:13px;color:#888}
.summary-date{font-size:13px;font-weight:500;color:#1D9E75}
.section-title{font-size:13px;color:#888;padding:12px 0 8px;font-weight:500}
.card{background:#fff;border:0.5px solid rgba(0,0,0,0.1);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.species-name{font-size:15px;font-weight:500;line-height:1.3}
.species-latin{font-size:12px;color:#888;font-style:italic;margin-top:2px}
.badge{font-size:11px;padding:3px 8px;border-radius:20px;background:#f0f0ec;color:#666;white-space:nowrap;flex-shrink:0}
.card-meta{display:flex;gap:12px;margin-top:8px;font-size:12px;color:#999;flex-wrap:wrap}
.dist-tag{color:#1D9E75;font-weight:500}
.group-header{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:#aaa;padding:14px 0 5px;border-top:0.5px solid rgba(0,0,0,0.08);margin-top:4px}
.group-header:first-of-type{border-top:none;margin-top:0}
.empty{text-align:center;padding:48px 20px;color:#aaa;font-size:14px;line-height:1.6}
.loading{text-align:center;padding:40px;color:#aaa;font-size:14px}
.error-box{background:#fff0f0;color:#c0392b;border-radius:10px;padding:12px 14px;font-size:14px;margin-top:8px;border:0.5px solid rgba(192,57,43,0.2)}
.chips{display:flex;gap:7px}
.chip{padding:7px 14px;border-radius:20px;border:0.5px solid rgba(0,0,0,0.18);font-size:13px;cursor:pointer;background:#fff;color:#666;transition:all .15s}
.chip.active{background:#1a1a1a;color:#fff;border-color:transparent}
.map-container{border-radius:12px;overflow:hidden;border:0.5px solid rgba(0,0,0,0.1);margin-top:8px;display:none}
#map{height:300px;width:100%}
.attr{font-size:11px;color:#bbb;text-align:center;padding:24px 0 8px}
.attr a{color:#bbb}
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <h1><span class="gps-dot pulsing" id="gps-dot"></span> Faune Autour</h1>
    <div class="gps-info" id="gps-info">Localisation en cours...</div>
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-search" onclick="switchTab('search')">Par espèce</div>
    <div class="tab" id="tab-explore" onclick="switchTab('explore')">Explorer autour</div>
  </div>

  <div class="panel active" id="panel-search">
    <div>
      <label>Nom de l'animal (français ou latin)</label>
      <input type="text" id="search-input" placeholder="ex: renard, Vulpes vulpes, chevreuil…"
        onkeydown="if(event.key==='Enter')doSearch()">
    </div>
    <div>
      <label>Rayon de recherche</label>
      <div class="slider-row">
        <input type="range" min="1" max="10" step="1" value="5" id="search-radius"
          oninput="document.getElementById('search-radius-val').textContent=this.value+' km'">
        <span class="slider-val" id="search-radius-val">5 km</span>
      </div>
    </div>
    <button class="btn" id="btn-search" onclick="doSearch()">Chercher les observations</button>
  </div>

  <div class="panel" id="panel-explore">
    <div>
      <label>Rayon</label>
      <div class="slider-row">
        <input type="range" min="1" max="10" step="1" value="5" id="explore-radius"
          oninput="document.getElementById('explore-radius-val').textContent=this.value+' km'">
        <span class="slider-val" id="explore-radius-val">5 km</span>
      </div>
    </div>
    <div>
      <label>Période</label>
      <div class="chips">
        <div class="chip active" onclick="setPeriod(this,'week')">Semaine</div>
        <div class="chip" onclick="setPeriod(this,'month')">Mois</div>
        <div class="chip" onclick="setPeriod(this,'year')">Année</div>
      </div>
    </div>
    <button class="btn" id="btn-explore" onclick="doExplore()">Lister les animaux</button>
  </div>

  <div class="results" id="results"></div>
  <div class="map-container" id="map-container"><div id="map"></div></div>

  <div class="attr">Données : <a href="https://www.gbif.org" target="_blank">GBIF</a> · incluant observations.be · carte <a href="https://www.openstreetmap.org" target="_blank">OpenStreetMap</a></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var gpsLat=null,gpsLon=null,gpsReady=false,selectedPeriod='week';
var leafletMap=null,markersLayer=null;

/* ---- GPS ---- */
function gpsInit(){
  if(!navigator.geolocation){
    gpsLat=50.8503;gpsLon=4.3517;gpsReady=true;
    setGpsLabel('Simulation Bruxelles','#e67e22');return;
  }
  navigator.geolocation.getCurrentPosition(function(pos){
    gpsLat=pos.coords.latitude;gpsLon=pos.coords.longitude;gpsReady=true;
    document.getElementById('gps-dot').classList.remove('pulsing');
    document.getElementById('gps-dot').style.background='#1D9E75';
    setGpsLabel('Position: '+gpsLat.toFixed(5)+', '+gpsLon.toFixed(5),'#888');
  },function(){
    gpsLat=50.8503;gpsLon=4.3517;gpsReady=true;
    document.getElementById('gps-dot').style.background='#e67e22';
    document.getElementById('gps-dot').classList.remove('pulsing');
    setGpsLabel('GPS refusé — simulation Bruxelles','#e67e22');
  },{enableHighAccuracy:true,timeout:10000,maximumAge:60000});
}
function setGpsLabel(msg,col){
  var el=document.getElementById('gps-info');el.textContent=msg;el.style.color=col||'#888';
}

/* ---- UI helpers ---- */
function setPeriod(el,p){
  selectedPeriod=p;
  document.querySelectorAll('.chip').forEach(function(c){c.classList.remove('active');});
  el.classList.add('active');
}
function switchTab(t){
  ['search','explore'].forEach(function(id){
    document.getElementById('tab-'+id).classList.toggle('active',t===id);
    document.getElementById('panel-'+id).classList.toggle('active',t===id);
  });
  clearResults();
}
function clearResults(){
  document.getElementById('results').innerHTML='';
  document.getElementById('map-container').style.display='none';
  if(markersLayer){markersLayer.clearLayers();}
}
function showError(msg){
  document.getElementById('results').innerHTML='<div class="error-box">'+msg+'</div>';
  document.getElementById('map-container').style.display='none';
}
function setLoading(btnId,msg){
  document.getElementById(btnId).disabled=true;
  document.getElementById(btnId).textContent=msg;
  document.getElementById('results').innerHTML='<div class="loading">Consultation de GBIF...</div>';
  document.getElementById('map-container').style.display='none';
}
function resetBtn(btnId,label){
  document.getElementById(btnId).disabled=false;
  document.getElementById(btnId).textContent=label;
}

/* ---- Geo helpers ---- */
function bboxWkt(lat,lon,km){
  var d=km/111.0;
  var dlon=km/(111.0*Math.cos(lat*Math.PI/180));
  return 'POLYGON(('+(lon-dlon)+' '+(lat-d)+','+(lon+dlon)+' '+(lat-d)+','+(lon+dlon)+' '+(lat+d)+','+(lon-dlon)+' '+(lat+d)+','+(lon-dlon)+' '+(lat-d)+'))';
}
function haversineKm(lat1,lon1,lat2,lon2){
  var R=6371,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function fmtDist(km){
  if(km<1) return Math.round(km*1000)+'m';
  return km.toFixed(1)+'km';
}
function dateFrom(period){
  var now=new Date();
  if(period==='week') return new Date(now-7*86400000).toISOString().split('T')[0];
  if(period==='month'){var d=new Date(now);d.setMonth(d.getMonth()-1);return d.toISOString().split('T')[0];}
  var d=new Date(now);d.setFullYear(d.getFullYear()-1);return d.toISOString().split('T')[0];
}
function today(){return new Date().toISOString().split('T')[0];}
function mostRecentDate(results){
  var best='';
  results.forEach(function(r){var d=r.eventDate||'';if(d>best)best=d;});
  return best?best.split('T')[0]:null;
}

/* ---- Map ---- */
function initMap(){
  if(leafletMap) return;
  leafletMap=L.map('map',{zoomControl:true});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© OpenStreetMap',maxZoom:18
  }).addTo(leafletMap);
  markersLayer=L.layerGroup().addTo(leafletMap);
}
function showMap(points,centerLat,centerLon){
  var mc=document.getElementById('map-container');
  mc.style.display='block';
  initMap();
  markersLayer.clearLayers();
  var myIcon=L.divIcon({className:'',html:'<div style="width:14px;height:14px;border-radius:50%;background:#e74c3c;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)"></div>',iconSize:[14,14],iconAnchor:[7,7]});
  var meIcon=L.divIcon({className:'',html:'<div style="width:16px;height:16px;border-radius:50%;background:#1D9E75;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>',iconSize:[16,16],iconAnchor:[8,8]});
  L.marker([centerLat,centerLon],{icon:meIcon}).bindPopup('Votre position').addTo(markersLayer);
  points.forEach(function(p){
    if(p.lat&&p.lon){
      var dist=fmtDist(haversineKm(centerLat,centerLon,p.lat,p.lon));
      L.marker([p.lat,p.lon],{icon:myIcon})
        .bindPopup('<strong>'+p.name+'</strong><br><em>'+p.latin+'</em><br>'+p.date+'<br>'+dist)
        .addTo(markersLayer);
    }
  });
  leafletMap.setView([centerLat,centerLon],13);
  setTimeout(function(){leafletMap.invalidateSize();},200);
}

/* ---- SEARCH by species ---- */
async function doSearch(){
  if(!gpsReady){showError('Position GPS non encore disponible.');return;}
  var q=document.getElementById('search-input').value.trim();
  if(!q){showError('Entrez un nom d\'animal.');return;}
  var radius=parseInt(document.getElementById('search-radius').value);
  setLoading('btn-search','Recherche…');
  try{
    var matchRes=await fetch('https://api.gbif.org/v1/species/match?name='+encodeURIComponent(q)+'&kingdom=Animalia&verbose=true');
    var match=await matchRes.json();
    if(!match.usageKey){
      showError('Espèce non trouvée. Essayez le nom latin (ex: <em>Vulpes vulpes</em>).');
      resetBtn('btn-search','Chercher les observations');return;
    }
    /* Bloquer les matchs trop larges (genre, famille, ordre, classe...) */
    var acceptedRanks=['SPECIES','SUBSPECIES','VARIETY','FORM'];
    if(!match.rank || acceptedRanks.indexOf(match.rank)===-1){
      var rankLabel=match.rank?match.rank.toLowerCase():'inconnu';
      showError('Résultat trop large : "<strong>'+(match.canonicalName||q)+'</strong>" est un '+rankLabel+', pas une espèce.<br>Précisez le nom, ex: <em>Vulpes vulpes</em>.');
      resetBtn('btn-search','Chercher les observations');return;
    }
    /* Bloquer si le match n'est pas fiable */
    if(match.matchType==='NONE'||match.matchType==='HIGHERRANK'){
      showError('Espèce non identifiée avec certitude. Essayez le nom latin.');
      resetBtn('btn-search','Chercher les observations');return;
    }
    var wkt=bboxWkt(gpsLat,gpsLon,radius);
    var url='https://api.gbif.org/v1/occurrence/search?taxonKey='+match.usageKey
      +'&geometry='+encodeURIComponent(wkt)
      +'&hasCoordinate=true&occurrenceStatus=PRESENT&limit=100';
    var res=await fetch(url);
    var data=await res.json();
    renderSearch(data.results||[],match,radius,data.count||0);
  }catch(e){showError('Erreur réseau.');}
  resetBtn('btn-search','Chercher les observations');
}

function renderSearch(results,match,radius,total){
  var el=document.getElementById('results');
  var speciesLabel=match.vernacularName||match.canonicalName||match.scientificName||'?';
  var latinLabel=match.scientificName||'';
  if(!results.length){
    el.innerHTML='<div class="section-title">'+speciesLabel+'</div><div class="empty">Aucune observation trouvée dans un rayon de '+radius+' km.</div>';
    return;
  }
  var mostRecent=mostRecentDate(results);
  var mapPoints=[];
  var html='';
  if(mostRecent){
    html+='<div class="summary-box"><span class="summary-label">Observation la plus récente</span><span class="summary-date">'+mostRecent+'</span></div>';
  }
  html+='<div class="section-title">'+results.length+' observation(s) · '+speciesLabel+' · '+radius+' km</div>';
  results.forEach(function(r){
    var date=r.eventDate?r.eventDate.split('T')[0]:(r.year?String(r.year):'—');
    var loc=r.locality||r.municipality||r.stateProvince||'';
    var distStr='';
    if(r.decimalLatitude&&r.decimalLongitude){
      var km=haversineKm(gpsLat,gpsLon,r.decimalLatitude,r.decimalLongitude);
      distStr='<span class="dist-tag">'+fmtDist(km)+'</span>';
      mapPoints.push({lat:r.decimalLatitude,lon:r.decimalLongitude,name:r.vernacularName||r.species||r.scientificName||'?',latin:r.scientificName||'',date:date});
    }
    html+='<div class="card">'
      +'<div class="card-top"><div>'
      +'<div class="species-name">'+(r.vernacularName||r.species||speciesLabel)+'</div>'
      +'<div class="species-latin">'+(r.scientificName||latinLabel)+'</div>'
      +'</div><span class="badge">'+date+'</span></div>'
      +'<div class="card-meta">'+(loc?'<span>'+loc+'</span>':'')+distStr+'</div>'
      +'</div>';
  });
  if(total>results.length) html+='<div class="section-title" style="color:#e67e22">'+total+' observations au total · affichage limité à '+results.length+'</div>';
  html+='<button class="btn-map" onclick="showMap(window._mapPoints,'+gpsLat+','+gpsLon+')">Voir sur la carte</button>';
  el.innerHTML=html;
  window._mapPoints=mapPoints;
}

/* ---- EXPLORE around ---- */
async function doExplore(){
  if(!gpsReady){showError('Position GPS non encore disponible.');return;}
  var radius=parseInt(document.getElementById('explore-radius').value);
  var after=dateFrom(selectedPeriod);
  var wkt=bboxWkt(gpsLat,gpsLon,radius);
  setLoading('btn-explore','Chargement…');
  try{
    var url='https://api.gbif.org/v1/occurrence/search'
      +'?geometry='+encodeURIComponent(wkt)
      +'&kingdomKey=1&hasCoordinate=true&occurrenceStatus=PRESENT'
      +'&eventDate='+after+','+today()+'&limit=300';
    var res=await fetch(url);
    var data=await res.json();
    renderExplore(data.results||[],radius,selectedPeriod,data.count||0);
  }catch(e){showError('Erreur réseau.');}
  resetBtn('btn-explore','Lister les animaux');
}

function renderExplore(results,radius,period,total){
  var el=document.getElementById('results');
  var pLabel={week:'cette semaine',month:'ce mois-ci',year:'cette année'}[period];
  if(!results.length){
    el.innerHTML='<div class="empty">Aucune observation trouvée<br>dans un rayon de '+radius+' km '+pLabel+'.</div>';
    return;
  }
  var classLabels={Aves:'Oiseaux',Mammalia:'Mammifères',Reptilia:'Reptiles',
    Amphibia:'Amphibiens',Actinopterygii:'Poissons',Insecta:'Insectes',
    Arachnida:'Arachnides',Lepidoptera:'Lépidoptères'};

  /* résolution noms français via vernacularName présent dans les occurrences */
  var speciesMap={};
  var mapPoints=[];
  results.forEach(function(r){
    var key=r.speciesKey||r.taxonKey;
    if(!key)return;
    if(!speciesMap[key]){
      /* nom français : vernacularName si dispo, sinon on garde le nom latin */
      var frName=r.vernacularName||'';
      var latinName=r.species||r.scientificName||'';
      speciesMap[key]={
        name:frName||latinName,
        nameFr:frName,
        latin:latinName,
        cls:r.class||'',
        count:0,
        lastDate:'',
        lastLat:null,lastLon:null
      };
    }
    /* si on trouve un vernacularName plus tard pour la même espèce, on le prend */
    if(!speciesMap[key].nameFr && r.vernacularName){
      speciesMap[key].nameFr=r.vernacularName;
      speciesMap[key].name=r.vernacularName;
    }
    speciesMap[key].count++;
    var d=r.eventDate||'';
    if(d>speciesMap[key].lastDate){
      speciesMap[key].lastDate=d;
      speciesMap[key].lastLat=r.decimalLatitude||null;
      speciesMap[key].lastLon=r.decimalLongitude||null;
    }
    if(r.decimalLatitude&&r.decimalLongitude){
      mapPoints.push({lat:r.decimalLatitude,lon:r.decimalLongitude,
        name:speciesMap[key].name,latin:speciesMap[key].latin,
        date:d?d.split('T')[0]:'—'});
    }
  });

  var species=Object.values(speciesMap).sort(function(a,b){return b.count-a.count;});
  var mostRecent=mostRecentDate(results);

  var groups={};
  species.forEach(function(s){
    var g=classLabels[s.cls]||s.cls||'Autres';
    if(!groups[g])groups[g]=[];
    groups[g].push(s);
  });

  var html='';
  if(mostRecent){
    html+='<div class="summary-box"><span class="summary-label">Observation la plus récente</span><span class="summary-date">'+mostRecent+'</span></div>';
  }
  html+='<div class="section-title">'+species.length+' espèce(s) · rayon '+radius+' km · '+pLabel+'</div>';

  Object.keys(groups).sort().forEach(function(group){
    html+='<div class="group-header">'+group+'</div>';
    groups[group].forEach(function(s){
      var date=s.lastDate?s.lastDate.split('T')[0]:'—';
      var distStr='';
      if(s.lastLat&&s.lastLon){
        var km=haversineKm(gpsLat,gpsLon,s.lastLat,s.lastLon);
        distStr='<span class="dist-tag">'+fmtDist(km)+'</span>';
      }
      /* affichage : nom français + latin en dessous */
      var displayName=s.nameFr||s.latin||'Inconnu';
      var displayLatin=s.nameFr?s.latin:'';
      html+='<div class="card">'
        +'<div class="card-top"><div>'
        +'<div class="species-name">'+displayName+'</div>'
        +(displayLatin?'<div class="species-latin">'+displayLatin+'</div>':'')
        +'</div><span class="badge">'+s.count+' obs.</span></div>'
        +'<div class="card-meta"><span>Dernière obs. '+date+'</span>'+distStr+'</div>'
        +'</div>';
    });
  });

  if(total>results.length) html+='<div class="section-title" style="color:#e67e22">'+total+' observations au total · affichage limité à 300</div>';
  html+='<button class="btn-map" onclick="showMap(window._mapPoints,'+gpsLat+','+gpsLon+')">Voir sur la carte</button>';
  el.innerHTML=html;
  window._mapPoints=mapPoints;
}

gpsInit();
</script>
</body>
</html>
